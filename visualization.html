<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交通数据可视化系统</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #FAFAFA 0%, #F5F5F7 100%);
      color: #1D1D1F;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .traffic-dashboard {
      min-height: 100vh;
      padding: 25px;
      background: transparent;
      position: relative;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 
        0 2px 12px rgba(0, 0, 0, 0.05),
        0 1px 4px rgba(0, 0, 0, 0.03);
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .dashboard-header h1 {
      color: #1D1D1F;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.01em;
      position: relative;
      z-index: 1;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .controls select {
      padding: 10px 16px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      color: #1d1d1f;
      min-width: 100px;
      outline: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .controls select:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(0, 0, 0, 0.3);
    }

    .controls select:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
    }

    .controls select:last-child {
      min-width: 80px;
    }

    .controls button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      outline: none;
      min-width: 80px;
      background: rgba(255, 255, 255, 0.9);
      color: #1d1d1f;
      border: 1px solid rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(0, 0, 0, 0.3);
      transform: translateY(-1px);
    }

    .controls button:active {
      transform: translateY(0);
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      animation: fadeInUp 0.8s ease-out;
      position: relative;
    }

    .chart-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 
        0 2px 16px rgba(0, 0, 0, 0.06),
        0 1px 4px rgba(0, 0, 0, 0.03);
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .chart-container:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 30px rgba(0, 0, 0, 0.12),
        0 4px 12px rgba(0, 0, 0, 0.08);
    }

    .chart-container h3 {
      color: #1D1D1F;
      margin-bottom: 16px;
      text-align: center;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 600;
      position: relative;
      padding-bottom: 8px;
      letter-spacing: 0;
    }

    .chart-container h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 1px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 1px;
    }

    .chart {
      height: 380px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.5);
    }

    .chart.large {
      height: 480px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1200px) {
      .chart-grid {
        gap: 12px;
      }
      
      .chart-container.medium {
        grid-column: span 1;
      }
      
      .stats-panel {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
    }

    @media (max-width: 768px) {
      .traffic-dashboard {
        padding: 12px;
      }
      
      .dashboard-header {
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        margin-bottom: 20px;
      }
      
      .chart-grid {
        gap: 12px;
      }
      
      .chart-container {
        padding: 16px;
        grid-column: span 1 !important;
      }
      
      .chart {
        height: 300px;
      }
      
      .chart.large {
        height: 340px;
      }
      
      .controls {
        justify-content: center;
        width: 100%;
        gap: 6px;
      }
      
      .controls select {
        flex: 1;
        min-width: 80px;
        font-size: 13px;
      }
      
      .controls button {
        flex: 1;
        min-width: 80px;
        font-size: 13px;
      }
      
      .stats-panel {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      
      .stat-card {
        padding: 12px;
        gap: 6px;
      }
    }  
      .stat-icon {
        width: 32px;
        height: 32px;
        font-size: 1.2rem;
      }
      
      .stat-value {
        font-size: 1.3rem;
      }
      
      .stat-label {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .dashboard-header h1 {
        font-size: 1.2rem;
      }
      
      .controls {
        flex-direction: column;
        width: 100%;
      }
      
      .controls select {
        width: 100%;
        min-width: auto;
      }
      
      .controls button {
        width: 100%;
        min-width: auto;
      }
      
      .chart {
        height: 260px;
      }
      
      .chart.large {
        height: 300px;
      }
      
      .stats-panel {
        grid-template-columns: 1fr;
        gap: 8px;
        margin-bottom: 16px;
      }
      
      .stat-card {
        padding: 10px;
        flex-direction: column;
        text-align: center;
        gap: 6px;
      }
      
      .stat-icon {
        width: 24px;
        height: 24px;
        font-size: 1rem;
      }
      
      .stat-value {
        font-size: 1.1rem;
      }
      
      .stat-label {
        font-size: 0.75rem;
      }
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(102, 126, 234, 0.5);
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(102, 126, 234, 0.7);
    }

    /* 加载动画 */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      color: white;
      position: relative;
    }

    .loading::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 30px;
      position: relative;
      z-index: 1;
    }

    .loading p {
      font-size: 20px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
    }

    /* 统计面板 */
    .stats-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 
        0 2px 12px rgba(0, 0, 0, 0.06),
        0 1px 4px rgba(0, 0, 0, 0.03);
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-card:hover {
      transform: translateY(-1px);
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.1),
        0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .stat-icon {
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      flex-shrink: 0;
      color: #1D1D1F;
    }

    .stat-content {
      flex: 1;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 3px;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #86868b;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .stat-change {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 4px;
      border-radius: 4px;
      display: inline-block;
    }

    .stat-change.positive {
      background: rgba(52, 199, 89, 0.1);
      color: #166534;
    }

    .stat-change.negative {
      background: rgba(255, 59, 48, 0.1);
      color: #dc2626;
    }

    /* 设置面板 */
    .settings-panel {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.08),
        0 8px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .settings-panel h4 {
      margin: 0 0 20px 0;
      color: #1a202c;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-item label {
      font-weight: 600;
      color: #4a5568;
      font-size: 0.9rem;
    }

    .setting-item select,
    .setting-item input[type="range"] {
      padding: 8px 12px;
      border: 2px solid rgba(102, 126, 234, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .setting-item select:focus,
    .setting-item input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .setting-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .setting-item span {
      font-weight: 600;
      color: #667eea;
      margin-left: 10px;
    }

    /* 对比分析面板 */
    .comparison-panel {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.08),
        0 8px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    .comparison-panel h4 {
      margin: 0 0 20px 0;
      color: #1a202c;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .comparison-item {
      background: rgba(248, 250, 252, 0.8);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    .comparison-item h5 {
      margin: 0 0 15px 0;
      color: #4a5568;
      font-size: 1rem;
      font-weight: 600;
    }

    .comparison-chart {
      height: 200px;
    }

    /* 告警面板 */
    .alert-panel {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.08),
        0 8px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeInUp 0.8s ease-out 0.8s both;
    }

    .alert-panel h4 {
      margin: 0 0 20px 0;
      color: #1a202c;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .alert-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border-radius: 12px;
      border-left: 4px solid #e53e3e;
      background: rgba(254, 226, 226, 0.1);
      transition: all 0.3s ease;
    }

    .alert-item.high {
      border-left-color: #e53e3e;
      background: rgba(254, 226, 226, 0.1);
    }

    .alert-item.medium {
      border-left-color: #f59e0b;
      background: rgba(254, 243, 199, 0.1);
    }

    .alert-item.low {
      border-left-color: #48bb78;
      background: rgba(237, 247, 237, 0.1);
    }

    .alert-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .alert-content {
      flex: 1;
    }

    .alert-title {
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 5px;
    }

    .alert-message {
      color: #4a5568;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .alert-time {
      color: #718096;
      font-size: 0.8rem;
    }

    .alert-dismiss {
      background: none;
      border: none;
      color: #718096;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 5px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .alert-dismiss:hover {
      background: rgba(226, 232, 240, 0.2);
      color: #1a202c;
    }

    /* 历史记录面板 */
    .history-panel {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.08),
        0 8px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeInUp 0.8s ease-out 1s both;
    }

    .history-panel h4 {
      margin: 0 0 20px 0;
      color: #1a202c;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .history-controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .history-controls input,
    .history-controls select {
      padding: 8px 12px;
      border: 2px solid rgba(102, 126, 234, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      outline: none;
    }

    .clear-btn {
      background: linear-gradient(135deg, #e53e3e, #c53030);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .clear-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.8);
      border: 1px solid rgba(226, 232, 240, 0.6);
      transition: all 0.3s ease;
    }

    .history-item:hover {
      background: rgba(243, 244, 246, 0.9);
      transform: translateX(5px);
    }

    .history-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .history-content {
      flex: 1;
    }

    .history-title {
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 5px;
    }

    .history-detail {
      color: #4a5568;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .history-time {
      color: #718096;
      font-size: 0.8rem;
    }

    /* 预测面板 */
    .prediction-panel {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.08),
        0 8px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeInUp 0.8s ease-out 1.2s both;
    }

    .prediction-panel h4 {
      margin: 0 0 20px 0;
      color: #1a202c;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .prediction-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .prediction-input {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prediction-input label {
      font-weight: 600;
      color: #4a5568;
      font-size: 0.9rem;
    }

    .prediction-input select,
    .prediction-input input {
      padding: 8px 12px;
      border: 2px solid rgba(102, 126, 234, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      outline: none;
    }

    .predict-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      grid-column: span 2;
    }

    .predict-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    .prediction-result {
      margin-top: 25px;
    }

    .history-btn {
      background: linear-gradient(135deg, #4299e1, #2b6cb0);
      color: white;
      box-shadow: 0 4px 15px rgba(66, 153, 225, 0.3);
    }

    .drill-btn {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .theme-btn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: white;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
    }

    .ai-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      position: relative;
    }

    .ai-btn::after {
      content: '';
      position: absolute;
      top: 5px;
      right: 5px;
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    /* 数据钻取面板 */
    .drill-panel {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.08),
        0 8px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.3);

        calculateStatistics() {
          if (!this.trafficData) return;
          
          // 计算总流量
          const totalFlow = this.trafficData.flowData.reduce((sum, item) => 
            sum + (this.selectedCity === 'nyc' ? item.nyc : item.chicago), 0);
          
          // 找到峰值时段
          const peakData = this.trafficData.flowData.reduce((max, item) => {
            const current = this.selectedCity === 'nyc' ? item.nyc : item.chicago;
            return current > max.value ? { hour: item.hour, value: current } : max;

          // 计算活跃区域
          const currentHourData = this.trafficData.hourlyDistrictData[this.selectedHour];
          const activeZones = currentHourData ?

          // 更新统计数据

            accuracy: 75 + Math.floor(Math.random() * 15), // 模拟准确率
            accuracyChange: Math.floor(Math.random() * 10) - 5,
            activeZones,
            totalZones: this.trafficData.districts.length
          };
        },

        toggleRealTime() {
          this.isRealTime = !this.isRealTime;
          
          if (this.isRealTime) {
            this.realTimeInterval = setInterval(() => {
              this.updateRealTimeData();
            }, this.settings.refreshInterval);
          } else {
            clearInterval(this.realTimeInterval);
            this.realTimeInterval = null;
          }
        },

        updateRealTimeData() {
          // 模拟实时数据更新
          this.generateMockData();
          this.calculateStatistics();
          this.initCharts();
        },

        exportData() {
          const data = {
            city: this.selectedCity,
            model: this.selectedModel,
            timestamp: new Date().toISOString(),
            statistics: this.statistics,
            trafficData: this.trafficData
          };
          
          const blob = new Blob([JSON.stringify(data, null, 2)], 
            { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `traffic-data-${this.selectedCity}-${Date.now()}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        },

        generateHeatmapData() {
          const data = [];
          const hours = Array.from({length: 24}, (_, i) => i);
          const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
          
          days.forEach((day, dayIndex) => {
            hours.forEach(hour => {
              data.push([hour, dayIndex, Math.floor(Math.random() * 100)]);
            });
          });
          
          return data;
        },

        generateScatterData() {
          const data = [];
          for (let i = 0; i < 100; i++) {
            const actual = Math.random() * 1000;
            const predicted = actual + (Math.random() - 0.5) * 200;
            data.push([actual, predicted]);
          }
          return data;
        },

        initCharts() {
          this.$nextTick(() => {
            this.initLineChart();
            this.initBarChart();
            this.initHeatmap();
            this.initPieChart();
            this.initScatterChart();
            this.initGaugeChart();
            this.initComparisonCharts();
            if (this.showDrillDown) {
              this.initDrillDownChart();
            }
          });
        },

        initLineChart() {
          const chartDom = document.getElementById('line-chart');
          const myChart = echarts.init(chartDom);
          
          const option = {
            title: {
              text: '24小时交通流量趋势',
              left: 'center'
            },
            tooltip: {
              trigger: 'axis'
            },
            legend: {
              data: ['纽约', '芝加哥'],
              top: 30
            },
            xAxis: {
              type: 'category',
              data: this.trafficData.hours
            },
            yAxis: {
              type: 'value',
              name: '流量'
            },
            series: [
              {
                name: '纽约',
                type: 'line',
                data: this.trafficData.flowData.map(item => item.nyc),
                smooth: true,
                itemStyle: { color: '#5470c6' }
              },
              {
                name: '芝加哥',
                type: 'line',
                data: this.trafficData.flowData.map(item => item.chicago),
                smooth: true,
                itemStyle: { color: '#91cc75' }
              }
            ]
          };
          
          myChart.setOption(option);
        },

        initBarChart() {
          const chartDom = document.getElementById('bar-chart');
          const myChart = echarts.init(chartDom);
          
          // 获取选定时刻的区域数据
          const currentHourData = this.trafficData.hourlyDistrictData[this.selectedHour];
          
          const option = {
            title: {
              text: `各区域流量对比 (${this.selectedHour})`,
              left: 'center'
            },
            tooltip: {
              trigger: 'axis',
              axisPointer: {
                type: 'shadow'
              },
              formatter: function(params) {
                let result = `${params[0].name}<br/>`;
                params.forEach(param => {
                  result += `${param.marker}${param.seriesName}: ${param.value}<br/>`;
                });
                return result;
              }
            },
            legend: {
              data: ['当前流量', '预测流量'],
              top: 30
            },
            xAxis: {
              type: 'category',
              data: this.trafficData.districts,
              axisLabel: {
                rotate: 30,
                interval: 0
              }
            },
            yAxis: {
              type: 'value',
              name: '流量'
            },
            series: [
              {
                name: '当前流量',
                type: 'bar',
                data: currentHourData.map(item => item.current),
                itemStyle: { 
                  color: '#5470c6',
                  borderRadius: [4, 4, 0, 0]
                }
              },
              {
                name: '预测流量',
                type: 'bar',
                data: currentHourData.map(item => item.predicted),
                itemStyle: { 
                  color: '#91cc75',
                  borderRadius: [4, 4, 0, 0]
                }
              }
            ]
          };
          
          myChart.setOption(option);
        },

        initHeatmap() {
          const chartDom = document.getElementById('heatmap-chart');
          const myChart = echarts.init(chartDom);
          
          const option = {
            title: {
              text: '一周交通流量热力图',
              left: 'center'
            },
            tooltip: {
              position: 'top',
              formatter: function (params) {
                return `${params.data[1]}:00<br/>流量: ${params.data[2]}`;
              }
            },
            grid: {
              height: '70%',
              top: '10%'
            },
            xAxis: {
              type: 'category',
              data: Array.from({length: 24}, (_, i) => i),
              splitArea: {
                show: true
              }
            },
            yAxis: {
              type: 'category',
              data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
              splitArea: {
                show: true
              }
            },
            visualMap: {
              min: 0,
              max: 100,
              calculable: true,
              orient: 'horizontal',
              left: 'center',
              bottom: '5%',
              inRange: {
                color: ['#313695', '#4575b4', '#74add1', '#abd9e9', '#e0f3f8', '#ffffbf', '#fee090', '#fdae61', '#f46d43', '#d73027', '#a50026']
              }
            },
            series: [{
              name: '流量',
              type: 'heatmap',
              data: this.trafficData.heatmapData,
              label: {
                show: false
              },
              emphasis: {
                itemStyle: {
                  shadowBlur: 10,
                  shadowColor: 'rgba(0, 0, 0, 0.5)'
                }
              }
            }]
          };
          
          myChart.setOption(option);
        },

        initPieChart() {
          const chartDom = document.getElementById('pie-chart');
          const myChart = echarts.init(chartDom);
          
          const option = {
            title: {
              text: '模型准确率对比',
              left: 'center'
            },
            tooltip: {
              trigger: 'item',
              formatter: '{a} <br/>{b}: {c}%'
            },
            legend: {
              orient: 'vertical',
              left: 'left',
              top: 'middle'
            },
            series: [
              {
                name: '准确率',
                type: 'pie',
                radius: '50%',
                data: this.trafficData.modelPerformance,
                emphasis: {
                  itemStyle: {
                    shadowBlur: 10,
                    shadowOffsetX: 0,
                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                  }
                }
              }
            ]
          };
          
          myChart.setOption(option);
        },

        initScatterChart() {
          const chartDom = document.getElementById('scatter-chart');
          const myChart = echarts.init(chartDom);
          
          const option = {
            title: {
              text: '预测值 vs 实际值',
              left: 'center'
            },
            tooltip: {
              trigger: 'item',
              formatter: function (params) {
                return `实际值: ${params.data[0].toFixed(2)}<br/>预测值: ${params.data[1].toFixed(2)}`;
              }
            },
            xAxis: {
              type: 'value',
              name: '实际值',
              splitLine: {
                lineStyle: {
                  type: 'dashed'
                }
              }
            },
            yAxis: {
              type: 'value',
              name: '预测值',
              splitLine: {
                lineStyle: {
                  type: 'dashed'
                }
              }
            },
            series: [{
              name: '数据点',
              type: 'scatter',
              data: this.trafficData.predictionData,
              itemStyle: {
                color: '#5470c6',
                opacity: 0.6
              }
            }, {
              name: '完美预测线',
              type: 'line',
              data: [[0, 0], [1000, 1000]],
              lineStyle: {
                color: '#ff0000',
                type: 'dashed'
              },
              showSymbol: false
            }]
          };
          
          myChart.setOption(option);
        },

        updateData() {
          this.generateMockData();
          this.initCharts();
        },

        updateBarChart() {
          this.initBarChart();
        }
      },
      template: `
        <div class="traffic-dashboard">
          <header class="dashboard-header">
            <h1>交通数据可视化系统</h1>
            <div class="controls">
              <select v-model="selectedCity" @change="updateData">
                <option value="nyc">纽约</option>
                <option value="chicago">芝加哥</option>
              </select>
              <select v-model="selectedModel" @change="updateData">
                <option value="myplan">MyPlan模型</option>
                <option value="lstm">LSTM模型</option>
                <option value="gru">GRU模型</option>
                <option value="mlp">MLP模型</option>
              </select>
              <select v-model="selectedHour" @change="updateBarChart" v-if="!isLoading && trafficData && trafficData.hours">
                <option v-for="hour in trafficData.hours" :key="hour" :value="hour">{{ hour }}</option>
              </select>
              <button @click="toggleRealTime" :class="['realtime-btn', { active: isRealTime }]">
                {{ isRealTime ? '停止实时' : '开始实时' }}
              </button>
              <button @click="exportData" class="export-btn">
                导出数据
              </button>
              <button @click="showSettings = !showSettings" class="settings-btn">
                ⚙️ 设置
              </button>
              <button @click="showComparison = !showComparison" class="comparison-btn">
                📈 对比分析
              </button>
              <button @click="showAlerts = !showAlerts" class="alert-btn">
                🔔 告警 ({{ alertCount }})
              </button>
              <button @click="showHistory = !showHistory" class="history-btn">
                📅 历史记录
              </button>
              <button @click="showDrillDown = !showDrillDown" class="drill-btn">
                🔍 数据钻取
              </button>
              <button @click="toggleTheme" class="theme-btn">
                {{ isDarkTheme ? '🌙' : '🌞' }} 主题
              </button>
              <button @click="showAIAssistant = !showAIAssistant" class="ai-btn">
                🤖 AI助手
              </button>
            </div>
          </header>

          <main class="dashboard-content" v-if="!isLoading">
            <!-- 统计面板 -->
            <div class="stats-panel">
              <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-content">
                  <div class="stat-value">{{ statistics.totalFlow }}</div>
                  <div class="stat-label">总流量</div>
                  <div class="stat-change" :class="{ positive: statistics.flowChange > 0, negative: statistics.flowChange < 0 }">
                    {{ statistics.flowChange > 0 ? '+' : '' }}{{ statistics.flowChange }}%
                  </div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-content">
                  <div class="stat-value">{{ statistics.peakHour }}</div>
                  <div class="stat-label">峰值时段</div>
                  <div class="stat-change">最高: {{ statistics.peakFlow }}</div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-content">
                  <div class="stat-value">{{ statistics.accuracy }}%</div>
                  <div class="stat-label">预测准确率</div>
                  <div class="stat-change" :class="{ positive: statistics.accuracyChange > 0, negative: statistics.accuracyChange < 0 }">
                    {{ statistics.accuracyChange > 0 ? '+' : '' }}{{ statistics.accuracyChange }}%
                  </div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-icon">📍</div>
                <div class="stat-content">
                  <div class="stat-value">{{ statistics.activeZones }}</div>
                  <div class="stat-label">活跃区域</div>
                  <div class="stat-change">共{{ statistics.totalZones }}个区域</div>
                </div>
              </div>
            </div>

            <!-- 设置面板 -->
            <div class="settings-panel" v-if="showSettings">
              <h4>⚙️ 系统设置</h4>
              <div class="settings-grid">
                <div class="setting-item">
                  <label>自动刷新间隔</label>
                  <select v-model="settings.refreshInterval">
                    <option value="1000">1秒</option>
                    <option value="5000">5秒</option>
                    <option value="10000">10秒</option>
                    <option value="30000">30秒</option>
                  </select>
                </div>
                <div class="setting-item">
                  <label>图表动画</label>
                  <input type="checkbox" v-model="settings.enableAnimation">
                </div>
                <div class="setting-item">
                  <label>显示网格线</label>
                  <input type="checkbox" v-model="settings.showGrid">
                </div>
                <div class="setting-item">
                  <label>数据点数量</label>
                  <input type="range" min="50" max="500" v-model="settings.dataPoints">
                  <span>{{ settings.dataPoints }}</span>
                </div>
              </div>
            </div>

            <!-- 对比分析面板 -->
            <div class="comparison-panel" v-if="showComparison">
              <h4>📈 模型对比分析</h4>
              <div class="comparison-grid">
                <div class="comparison-item">
                  <h5>准确率对比</h5>
                  <div class="comparison-chart" id="accuracy-comparison"></div>
                </div>
                <div class="comparison-item">
                  <h5>响应时间对比</h5>
                  <div class="comparison-chart" id="response-comparison"></div>
                </div>
                <div class="comparison-item">
                  <h5>资源消耗对比</h5>
                  <div class="comparison-chart" id="resource-comparison"></div>
                </div>
                <div class="comparison-item">
                  <h5>预测偏差分析</h5>
                  <div class="comparison-chart" id="deviation-comparison"></div>
                </div>
              </div>
            </div>

            <!-- 告警面板 -->
            <div class="alert-panel" v-if="showAlerts">
              <h4>🔔 智能告警系统</h4>
              <div class="alert-list">
                <div v-for="alert in alerts" :key="alert.id" :class="['alert-item', alert.severity]">
                  <div class="alert-icon">{{ getAlertIcon(alert.type) }}</div>
                  <div class="alert-content">
                    <div class="alert-title">{{ alert.title }}</div>
                    <div class="alert-message">{{ alert.message }}</div>
                    <div class="alert-time">{{ alert.time }}</div>
                  </div>
                  <button @click="dismissAlert(alert.id)" class="alert-dismiss">✕</button>
                </div>
              </div>
            </div>

            <!-- 历史记录面板 -->
            <div class="history-panel" v-if="showHistory">
              <h4>📅 历史记录</h4>
              <div class="history-controls">
                <input type="date" v-model="historyDate" @change="loadHistoryData">
                <select v-model="historyType">
                  <option value="all">全部记录</option>
                  <option value="alerts">告警记录</option>
                  <option value="exports">导出记录</option>
                  <option value="predictions">预测记录</option>
                </select>
                <button @click="clearHistory" class="clear-btn">清空历史</button>
              </div>
              <div class="history-list">
                <div v-for="record in filteredHistory" :key="record.id" class="history-item">
                  <div class="history-icon">{{ getHistoryIcon(record.type) }}</div>
                  <div class="history-content">
                    <div class="history-title">{{ record.title }}</div>
                    <div class="history-detail">{{ record.detail }}</div>
                    <div class="history-time">{{ record.time }}</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 预测模型面板 -->
            <div class="prediction-panel">
              <h4>🤖 智能预测模型</h4>
              <div class="prediction-controls">
                <div class="prediction-input">
                  <label>预测时间范围</label>
                  <select v-model="predictionRange">
                    <option value="1h">1小时</option>
                    <option value="6h">6小时</option>
                    <option value="24h">24小时</option>
                    <option value="7d">7天</option>
                  </select>
                </div>
                <div class="prediction-input">
                  <label>置信度阈值</label>
                  <input type="range" min="0.5" max="1" step="0.1" v-model="confidenceThreshold">
                  <span>{{ (confidenceThreshold * 100).toFixed(0) }}%</span>
                </div>
                <button @click="runPrediction" class="predict-btn">🔮 开始预测</button>
              </div>
              <div class="prediction-result" v-if="predictionResult">
                <div class="prediction-chart" id="prediction-chart"></div>
              </div>
            </div>

            <!-- 数据钻取面板 -->
            <div class="drill-panel" v-if="showDrillDown">
              <h4>🔍 数据钻取分析</h4>
              <div class="drill-controls">
                <div class="drill-input">
                  <label>选择区域</label>
                  <select v-model="drillDownData.selectedDistrict">
                    <option v-for="district in trafficData.districts" :key="district" :value="district">{{ district }}</option>
                  </select>
                </div>
                <div class="drill-input">
                  <label>时间范围</label>
                  <select v-model="drillDownData.timeRange">
                    <option value="today">今天</option>
                    <option value="week">本周</option>
                    <option value="month">本月</option>
                    <option value="year">今年</option>
                  </select>
                </div>
                <div class="drill-input">
                  <label>分析维度</label>
                  <select v-model="drillDownData.dimension">
                    <option value="flow">流量分析</option>
                    <option value="speed">速度分析</option>
                    <option value="density">密度分析</option>
                    <option value="pattern">模式分析</option>
                  </select>
                </div>
              </div>
              <div class="drill-results">
                <div class="drill-chart" id="drill-chart"></div>
                <div class="drill-insights">
                  <h5>🧠 智能洞察</h5>
                  <ul>
                    <li v-for="insight in drillDownData.insights" :key="insight.id">
                      <span class="insight-type">{{ insight.type }}:</span>
                      {{ insight.description }}
                    </li>
                  </ul>
                </div>
              </div>
            </div>

            <!-- AI助手面板 -->
            <div class="ai-panel" v-if="showAIAssistant">
              <h4>🤖 AI智能助手</h4>
              <div class="ai-chat">
                <div class="ai-messages">
                  <div v-for="message in aiMessages" :key="message.id" :class="['ai-message', message.sender]">
                    <div class="message-avatar">{{ message.sender === 'user' ? '👤' : '🤖' }}</div>
                    <div class="message-content">
                      <div class="message-text">{{ message.text }}</div>
                      <div class="message-time">{{ message.time }}</div>
                    </div>
                  </div>
                </div>
                <div class="ai-input">
                  <div class="ai-suggestions">
                    <span v-for="suggestion in aiSuggestions" :key="suggestion" 
                          @click="sendSuggestion(suggestion)" class="suggestion-chip">
                      {{ suggestion }}
                    </span>
                  </div>
                  <div class="ai-type-area">
                    <input v-model="aiInputText" @keyup.enter="sendAIMessage" 
                           placeholder="询问关于交通数据的任何问题..." 
                           class="ai-input-field">
                    <button @click="sendAIMessage" class="ai-send-btn">🚀</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 性能监控面板 -->
            <div class="performance-panel">
              <h4>⚡ 系统性能监控</h4>
              <div class="performance-grid">
                <div class="perf-item">
                  <div class="perf-label">CPU使用率</div>
                  <div class="perf-value">
                    <div class="perf-bar">
                      <div class="perf-fill" :style="{ width: performance.cpu + '%' }"></div>
                    </div>
                    <span>{{ performance.cpu }}%</span>
                  </div>
                </div>
                <div class="perf-item">
                  <div class="perf-label">内存使用</div>
                  <div class="perf-value">
                    <div class="perf-bar">
                      <div class="perf-fill memory" :style="{ width: performance.memory + '%' }"></div>
                    </div>
                    <span>{{ performance.memory }}%</span>
                  </div>
                </div>
                <div class="perf-item">
                  <div class="perf-label">网络延迟</div>
                  <div class="perf-value">
                    <span class="perf-number">{{ performance.latency }}ms</span>
                  </div>
                </div>
                <div class="perf-item">
                  <div class="perf-label">数据处理</div>
                  <div class="perf-value">
                    <span class="perf-number">{{ performance.processed }}条/秒</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="chart-grid">
              <!-- 交通流量趋势图 -->
              <div class="chart-container medium">
                <h3>交通流量趋势</h3>
                <div id="line-chart" class="chart"></div>
              </div>

              <!-- 区域流量对比图 -->
              <div class="chart-container medium">
                <h3>区域流量对比</h3>
                <div id="bar-chart" class="chart"></div>
              </div>

              <!-- 热力图 -->
              <div class="chart-container large">
                <h3>交通流量热力图</h3>
                <div id="heatmap-chart" class="chart large"></div>
              </div>

              <!-- 实时监控仪表盘 -->
              <div class="chart-container medium">
                <h3>实时监控仪表盘</h3>
                <div id="gauge-chart" class="chart"></div>
              </div>

              <!-- 模型性能对比 -->
              <div class="chart-container medium">
                <h3>模型性能对比</h3>
                <div id="pie-chart" class="chart"></div>
              </div>

              <!-- 预测vs实际 -->
              <div class="chart-container medium">
                <h3>预测 vs 实际</h3>
                <div id="scatter-chart" class="chart"></div>
              </div>
            </div>
          </main>
          
          <div class="loading" v-else>
            <div class="loading-spinner"></div>
            <p>正在加载数据...</p>
          </div>
        </div>
      `
    };

    createApp({
      components: {
        TrafficDashboard
      }
    }).mount('#app');
  </script>
</body>
</html>
